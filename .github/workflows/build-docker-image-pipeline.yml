name: Build and Push Docker Image
run-name: ${{ github.actor }} builds web container
on:
  push:
    branches:
      - develop
    tags:
      - 'v*.*'
permissions:
  contents: read
  packages: write
jobs:
  build-develop:
    if: startsWith(github.ref, 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/fh-joanneum-iron-road-for-children/iron-road-for-children-web/web:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  build-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fh-joanneum-iron-road-for-children/iron-road-for-children-web/web:latest
            ghcr.io/fh-joanneum-iron-road-for-children/iron-road-for-children-web/web:${{ steps.version.outputs.version }}
