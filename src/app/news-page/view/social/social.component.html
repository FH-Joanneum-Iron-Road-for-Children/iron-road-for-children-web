<!DOCTYPE html>
<html lang="de">
  <head>
    <link rel="stylesheet" href="social.component.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socials hochladen</title>
    <script type="text/javascript" src="./social.component.js"></script>
  </head>

  <body>
    <h2>Social Media Link hinzufügen</h2>
    <div
      class="social-text-field"
      *ngFor="let link of socialLinks; let i = index">
      <a [href]="link.link" target="_blank" rel="noopener noreferrer">
        {{ link.title }}
      </a>
      <button
        (click)="removeFileEntry(i)"
        class="delete-button"
        aria-label="Löschen">
        ❌
      </button>
    </div>

    <div class="add-link-form">
      <select placeholder="title" #title>
        <div
          class="social-text-field"
          *ngFor="let option of givenSocialLinks; let i = index">
          <option type="text" value="{{ option.title }}">
            {{ option.title }}
          </option>
        </div>
      </select>
      <input type="text" #link placeholder="link" />
      <button
        (click)="
          addSocialLink(title.value, link.value);
          title.value = '';
          link.value = ''
        ">
        Hinzufügen
      </button>
    </div>
  </body>
</html>
